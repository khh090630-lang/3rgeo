<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>수능 기하 자작 문항 도형</title>
<style>
    body { margin: 0; display: flex; justify-content: center; align-items: center; background: #f0f2f5; height: 100vh; }
    canvas { background: #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.1); border: 1px solid #d1d5db; border-radius: 8px; }
</style>
</head>
<body>
<canvas id="csatGeometry" width="700" height="500"></canvas>
<script>
    const canvas = document.getElementById('csatGeometry');
    const ctx = canvas.getContext('2d');
    const scale = 25; // 1단위 = 25px
    const cx = 350;
    const cy = 250;

    const toX = x => cx + x * scale;
    const toY = y => cy - y * scale;

    // x축, y축 그리기
    ctx.beginPath();
    ctx.moveTo(50, cy); ctx.lineTo(650, cy);
    ctx.moveTo(cx, 50); ctx.lineTo(cx, 450);
    ctx.strokeStyle = '#4b5563'; ctx.lineWidth = 1; ctx.stroke();
    ctx.font = 'italic 16px serif'; ctx.fillStyle = '#000';
    ctx.fillText('x', 635, cy + 20);
    ctx.fillText('y', cx + 10, 60);
    ctx.fillText('O', cx - 20, cy + 20);

    // 타원 (a=5, b=4)
    ctx.beginPath(); 
    ctx.ellipse(cx, cy, 5*scale, 4*scale, 0, 0, 2*Math.PI);
    ctx.strokeStyle = '#111827'; ctx.lineWidth = 1.5; ctx.stroke();

    // 쌍곡선 (p=2, q=sqrt(5))
    ctx.beginPath();
    for(let y=-7; y<=7; y+=0.1) {
        let x = 2 * Math.sqrt(1 + (y*y)/5);
        if(y===-7) ctx.moveTo(toX(x), toY(y)); else ctx.lineTo(toX(x), toY(y));
    }
    for(let y=-7; y<=7; y+=0.1) {
        let x = -2 * Math.sqrt(1 + (y*y)/5);
        if(y===-7) ctx.moveTo(toX(x), toY(y)); else ctx.lineTo(toX(x), toY(y));
    }
    ctx.stroke();

    // 포물선 (y^2=12x) - 점선으로 구분
    ctx.beginPath();
    for(let y=-8; y<=8; y+=0.1) {
        let x = (y*y)/12;
        if(y===-8) ctx.moveTo(toX(x), toY(y)); else ctx.lineTo(toX(x), toY(y));
    }
    ctx.setLineDash([5, 5]); ctx.strokeStyle = '#6b7280'; ctx.stroke(); ctx.setLineDash([]);

    // 접점 A(3, 3.2), 접선, 법선
    const ax = 3, ay = 3.2;
    const qx = 25/3; // Q(25/3, 0)
    const rx = 27/25; // R(27/25, 0)
    
    // 접선 l
    ctx.beginPath(); ctx.moveTo(toX(10), toY(-3/5*10 + 5)); ctx.lineTo(toX(-1), toY(-3/5*(-1) + 5));
    ctx.lineWidth = 1; ctx.strokeStyle = '#111827'; ctx.stroke();
    // 법선
    ctx.beginPath(); ctx.moveTo(toX(0.5), toY(5/3*0.5 - 9/5)); ctx.lineTo(toX(4), toY(5/3*4 - 9/5));
    ctx.stroke();

    // 점 A, Q, R 표시
    ctx.beginPath(); ctx.arc(toX(ax), toY(ay), 3.5, 0, 2*Math.PI); ctx.fill();
    ctx.fillText('A', toX(ax)+8, toY(ay)-8);
    ctx.beginPath(); ctx.arc(toX(qx), toY(0), 3.5, 0, 2*Math.PI); ctx.fill();
    ctx.fillText('Q', toX(qx)-5, toY(0)+22);
    ctx.beginPath(); ctx.arc(toX(rx), toY(0), 3.5, 0, 2*Math.PI); ctx.fill();
    ctx.fillText('R', toX(rx)-12, toY(0)+22);

    // 타원, 쌍곡선 교점 P(10/3, 4sqrt(5)/3)
    const px = 10/3, py = (4*Math.sqrt(5))/3;
    ctx.beginPath(); ctx.arc(toX(px), toY(py), 4, 0, 2*Math.PI); ctx.fill();
    ctx.fillText('P', toX(px)+10, toY(py)+2);

    // 점 P를 지나는 y축 평행선과 M, N
    const my = Math.sqrt(40); 
    ctx.beginPath(); ctx.moveTo(toX(px), toY(my+0.5)); ctx.lineTo(toX(px), toY(-my-0.5));
    ctx.lineWidth = 0.8; ctx.stroke();
    
    ctx.beginPath(); ctx.arc(toX(px), toY(my), 3.5, 0, 2*Math.PI); ctx.fill();
    ctx.fillText('M', toX(px)+8, toY(my)-5);
    ctx.beginPath(); ctx.arc(toX(px), toY(-my), 3.5, 0, 2*Math.PI); ctx.fill();
    ctx.fillText('N', toX(px)+8, toY(-my)+15);

    // 초점 F(3,0), F'(-3,0)
    ctx.beginPath(); ctx.arc(toX(3), toY(0), 3.5, 0, 2*Math.PI); ctx.fill();
    ctx.fillText('F', toX(3)-5, toY(0)-12);
    ctx.beginPath(); ctx.arc(toX(-3), toY(0), 3.5, 0, 2*Math.PI); ctx.fill();
    ctx.fillText("F'", toX(-3)-12, toY(0)-12);
</script>
</body>
</html>
